<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>False Cognates – Révision</title>
<style>
:root{--bg:#0f172a;--card:#1e293b;--txt:#e2e8f0;--mut:#94a3b8;--ok:#22c55e;--bad:#ef4444;--acc:#38bdf8}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;display:flex;justify-content:center;padding:20px}
.wrap{width:100%;max-width:820px}
h1{font-size:1.5rem;margin:0 0 4px}
.sub{color:var(--mut);font-size:.9rem;margin-bottom:16px}
.card{background:var(--card);border-radius:14px;padding:20px;margin-bottom:14px;box-shadow:0 4px 18px #0005}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button,select{font:inherit;border:0;border-radius:9px;padding:9px 14px;cursor:pointer;background:#334155;color:var(--txt)}
button:hover{background:#475569}
button.primary{background:var(--acc);color:#04202e;font-weight:600}
button.primary:hover{background:#7dd3fc}
button:disabled{opacity:.4;cursor:default}
.stats{display:flex;gap:16px;flex-wrap:wrap;font-size:.9rem;color:var(--mut)}
.stats b{color:var(--txt)}
.bar{height:6px;background:#334155;border-radius:4px;overflow:hidden;margin:10px 0}
.bar>div{height:100%;background:var(--acc);width:0;transition:width .3s}
.step{font-size:.85rem;color:var(--acc);text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px}
#sentence{font-size:1.3rem;line-height:2.1;margin:6px 0 14px}
.w{padding:2px 4px;border-radius:6px;cursor:pointer;transition:background .15s}
.w:hover{background:#334155}
.w.sel{background:#f59e0b55;outline:2px solid #f59e0b}
.w.good{background:#22c55e44;text-decoration:line-through;outline:2px solid var(--ok)}
.w.miss{background:#ef444455}
.locked .w{cursor:default}
input[type=text]{font:inherit;width:100%;padding:12px;border-radius:9px;border:2px solid #475569;background:#0f172a;color:var(--txt);margin:6px 0}
input[type=text]:focus{outline:0;border-color:var(--acc)}
#fb{min-height:1.6em;margin-top:10px;font-size:1rem}
.ok{color:var(--ok)}.ko{color:var(--bad)}
.hide{display:none}
.shake{animation:sh .3s}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.mut{color:var(--mut);font-size:.88rem}
kbd{background:#334155;border-radius:4px;padding:1px 6px;font-size:.8rem}
</style>
</head>
<body>
<div class="wrap">
<h1>🔎 False Cognates – Révision</h1>
<div class="sub">Clique sur le faux ami dans la phrase, puis tape le mot juste. Source : ANL-2020, Dave Zinck (False Cognates #1, #2, #3).</div>

<div class="card">
  <div class="row">
    <select id="set">
      <option value="all">Tout (75 phrases)</option>
      <option value="1">Série #1 (28)</option>
      <option value="2">Série #2 (25)</option>
      <option value="3">Série #3 (22)</option>
      <option value="miss">Mes erreurs seulement</option>
    </select>
    <label class="mut"><input type="checkbox" id="shuf" checked> Mélanger</label>
    <button class="primary" id="start">Commencer</button>
    <button id="reset" title="Efface les erreurs mémorisées">Réinitialiser les erreurs</button>
  </div>
</div>

<div class="card hide" id="quiz">
  <div class="stats">
    <span>Question <b id="qn">0</b>/<b id="qt">0</b></span>
    <span>Score <b id="sc">0</b></span>
    <span>Série <b id="stk">0</b> 🔥</span>
    <span id="setlab"></span>
  </div>
  <div class="bar"><div id="pb"></div></div>
  <div class="step" id="step"></div>
  <div id="sentence"></div>
  <div id="typing" class="hide">
    <div class="mut">Mot juste pour remplacer <b id="wrongw"></b> :</div>
    <input type="text" id="ans" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Écris le mot en anglais…">
  </div>
  <div class="row">
    <button class="primary" id="ok" disabled>Valider</button>
    <button id="hint">💡 Indice</button>
    <button id="skip">Passer</button>
    <button id="next" class="hide primary">Suivant →</button>
  </div>
  <div id="fb"></div>
  <div class="mut" style="margin-top:8px"><kbd>Entrée</kbd> valider / suivant</div>
</div>

<div class="card hide" id="end">
  <h2 style="margin-top:0">Terminé 🎉</h2>
  <p id="endtxt"></p>
  <div class="row"><button class="primary" id="again">Recommencer</button><button id="redo">Refaire mes erreurs</button></div>
</div>
</div>

<script>
// Syntaxe : [[faux ami=bonne réponse/autre réponse acceptée]]
const DATA = [
// ---- Série 1
[1,"The comedian was performing in a club in New York located in the [[cave=basement]] of a building in Times Square."],
[1,"Melvin asked the taxi [[conductor=driver]] to take him to the nearest library."],
[1,"[[Actually=Currently]], I'm a teacher but I intend to change jobs soon. I build furniture as a hobby and I'm ready to make it my profession."],
[1,"The professor in our Advanced Economics course told us we'd have to work hard if we wanted good [[notes=marks/grades]] in his class."],
[1,"There was no [[vacation=vacancy/vacancies]] at the motel after all of Debbie's relatives, including her aunts, uncles, and cousins, booked rooms for the weekend of her wedding."],
[1,"The professional [[photograph=photographer]] took some excellent pictures of our son when he was an infant."],
[1,"My neighbour helped me carry my new TV into my house. He is very kind. I'll write him a thank you [[mark=note]] after I finish hooking it up."],
[1,"Do you think it's [[sensitive=sensible/wise]] for your brother to stay in the college residence for his whole degree?"],
[1,"Why is Jennifer so upset?! She is [[crying=screaming/yelling/shouting]] insults at her brother and demanding that he leave her alone."],
[1,"A producer of a Shakespearean tragedy is looking for actors who can convey the [[strict=severe]] agony of the characters."],
[1,"Can I borrow a [[crayon=pencil]] from you so I can write my exam? I forgot mine at home and I don't want to ask the teacher."],
[1,"He's a very [[nice=kind]] man as he is always prepared to help people with thoughtful actions or a piece of advice."],
[1,"Sydney's going to [[command=order]] a pizza for supper. It's been a long day and she'd rather rest than work in the kitchen."],
[1,"What is the [[temperature=weather]] like? Is it raining? Do I need an umbrella or am I fine without one?"],
[1,"At the beginning of each semester, Chris always tries to buy his supplies at the university [[library=bookstore]] before the lines are too long."],
[1,"I can't believe my sister is crying because I made a funny face at her. She is too [[sensible=sensitive]] in my opinion."],
[1,"My uncle works in a tire factory with a lot of dangerous [[mechanic=machinery]]; one of his co-workers sustained severe injuries due to inattention on the job."],
[1,"When I was young, my favourite teacher was Ms. Hendricks. She taught grade-five math. She was [[severe=strict]] but fair."],
[1,"As you can see in this photograph, he has a chubby [[figure=face]], but the rest of his body is thin."],
[1,"I just got back from a relaxing vacation in the Caribbean. I'm really going to miss the warm, [[sympathetic=gentle/soft/light]] breeze every morning."],
[1,"It is difficult to get an appointment to see a [[medicine=doctor]] these days. If you call today, you might actually see someone in 3 months."],
[1,"I didn't know you had a four-year-old [[infant=child]]. The crayons and drawings on your coffee table should have given me a hint."],
[1,"Charlie's classes started only two weeks ago, but her classmates seem very [[sympathetic=nice]]. She thinks it will be a fun semester."],
[1,"I used the [[sentence=phrase]] “behind the scenes” when I called my friend Jacob yesterday. He's an actor in a play on Broadway in New York."],
[1,"My [[relatives=parents]] wondered if all the supplies I bought were necessary when they saw my bill from the university bookstore at the beginning of the semester."],
[1,"Can I ask you something? My car is making a funny noise; do you know a good [[machinery=mechanic]]?"],
[1,"When writing an exam, our teacher says to always check that our [[phrases=sentences]] are complete and have correct punctuation."],
[1,"If someone is late for practice, our basketball coach is strict but [[sensitive=sensible/fair/reasonable]]; the late player plays fewer minutes than the others in our next game."],
// ---- Série 2
[2,"My cousin's [[marriage=wedding]] is next week, only two months after her engagement!"],
[2,"All the reading you do for your literature course will add to your [[formation=education]]."],
[2,"Julie's comprehensive training includes her [[stage=internship]] with the government."],
[2,"As a reporter, I sometimes attend [[processes=trials]] at the courthouse."],
[2,"The fire destroyed their home, but their [[souvenirs=memories]] will assist with their healing."],
[2,"After proving he had not committed plagiarism in his exams, the student demanded that his [[inscription=registration]] for next semester be accepted."],
[2,"My mother was upset when I took her car without asking her first, so I [[formed=made/offered/gave/wrote]] an acceptable apology and promised to never do it again."],
[2,"The dismantling of the family [[enterprise=company/business]] was a disappointment for the entire clan."],
[2,"[[Resuming=Summarizing/Summarising]] texts for our writing course is a demanding but helpful process."],
[2,"My wife doesn't mind that I go on a week-long journey in a foreign country with my brother twice a year. She is extremely [[comprehensive=understanding]]."],
[2,"The reason for the specialist's [[engagement=hiring]] was to improve relations between the government and its business leaders."],
[2,"She was utterly [[upset=shocked/stunned/horrified]] by the accident; why did something so tragic happen?"],
[2,"Some locals were disappointed when their daily [[journal=newspaper/paper]] ceased to be printed and only became available online."],
[2,"I'm going to stop at the grocery store and pick something up for supper on my way home from work. Do you have any [[demands=requests]]?"],
[2,"As a part of my [[education=upbringing]], my parents lectured me on being polite to others."],
[2,"There were very few training sessions to [[assist=attend]] when I started my job. My boss just expected me to learn as I worked."],
[2,"What is the number of the [[local=room/classroom]] for tomorrow's class? I want to arrive early."],
[2,"I want to write in my journal, but the sun is bright. Would you close the [[stores=blinds]]?"],
[2,"I attended last night's performance of the play being presented at our local theatre. I would give it a [[note=mark/grade/rating/score]] of 7.5 out of 10."],
[2,"When his parents retire, Josh will run the family company. They have a small [[memory=souvenir]] pin factory which employs twenty people in their town."],
[2,"We can [[summarise=resume]] this conversation later. Have a good day at work!"],
[2,"It is a supervisor's job to [[form=train]] new employees when they arrive at a company."],
[2,"Before moving out, my mother lectured me about which [[mark=brand]] of laundry soap to use."],
[2,"After 32 years of marriage, Mr. and Mrs. Brooks are seeing a counsellor to work on their [[relation=relationship]]."],
[2,"I need to stop at the jewelry store to pick up a watch with an [[registration=inscription/engraving]] on it for my girlfriend. Do you mind waiting in the car for five minutes?"],
// ---- Série 3
[3,"After conducting an [[experience=experiment]] with her patient, the psychologist realised what the true issue was."],
[3,"My father is a fan of spy [[news=novels]] by a select group of authors."],
[3,"The newly engaged couple's experience of choosing their wedding [[alliances=rings]] together proved to be pleasant."],
[3,"I hope my team from my philosophy class will get some actual work done on our big project at our [[reunion=meeting]] today."],
[3,"The remarks you made at supper last night [[deranged=bothered/upset/annoyed]] your mother."],
[3,"After class I'm going to [[pass=take]] my driving test at the bureau of motor vehicles."],
[3,"The business [[congresses=conventions]] in Miami next week could be an opportunity to make connections with others in the same field."],
[3,"The [[ancient=former]] teachers attended the occasion of the new school's opening."],
[3,"When I rented a car to drive to Montreal for my class [[meeting=reunion]], the company asked me for a deposit of $200 to cover potential damages."],
[3,"My [[rendezvous=appointment]] with a financial advisor to review my accounts is this evening."],
[3,"Studies show a [[wide=large/big/great]] number of young men have been dropping out of high school. Indeed, the majority of graduates are female."],
[3,"The 5 o'clock [[circulation=traffic]] bothers some people, but not me. Indeed, I find the time alone in my car quite pleasant."],
[3,"I hope your [[affair=business/deal]] with that man will be a success. Perhaps it could lead to an alliance which would benefit you both."],
[3,"My brother is an administrator at the Museum of Ancient History. His [[bureau=office]] is on the third floor."],
[3,"I hadn't noticed that the little restaurant down the street had closed. I guess the menu didn't [[take=pass]] the test with its diners."],
[3,"Some of the streets in Old Québec are not very [[large=wide]], so they have become one-ways to avoid accidents and traffic problems."],
[3,"Have you heard the good [[novel=news]]? My son got a job as a musician, so he's not an amateur anymore!"],
[3,"We saw on the news that the [[actual=current]] MLA for our riding is having an affair with the opposition leader, so she surely won't be running in the next election."],
[3,"Jonah knew that his testimony before the congress was an excellent [[occasion=opportunity/chance]] to demonstrate his knowledge in his field."],
[3,"William [[realised=accomplished/achieved]] one of his many career goals upon making his first million dollars. No one could deny that he had run his business effectively."],
[3,"Before driving down that street, John was unaware that it didn't have an [[issue=exit]], but that explained the lack of traffic."],
[3,"When young Jimmy's friends found the clown very amusing, his parents realised the [[current=actual/real/true]] cost of his birthday party was totally worth it."]
];

const $=id=>document.getElementById(id);
const norm=s=>s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z\s'-]/g,"").trim().replace(/\s+/g," ");
const KEY="fc_missed_v1";
let missed=new Set(JSON.parse(localStorage.getItem(KEY)||"[]"));
const items=DATA.map((d,i)=>{
  const m=d[1].match(/\[\[(.+?)=(.+?)\]\]/);
  const ph="\u27E6X\u27E7";
  const text=d[1].replace(m[0],ph);
  const toks=text.split(/\s+/).map(t=>t.includes(ph)?{wrong:true,pre:t.split(ph)[0],post:t.split(ph)[1]}:{t});
  return {id:i,set:d[0],toks,wrong:m[1],answers:m[2].split("/")};
});
let Q=[],idx=0,score=0,streak=0,cur=null,phase=0,errs=0,sel=-1,done=false,hintLvl=0;

function start(list){
  Q=list.slice(); if($("shuf").checked) Q.sort(()=>Math.random()-.5);
  if(!Q.length){alert("Aucune question dans cette sélection.");return}
  idx=0;score=0;streak=0;
  $("end").classList.add("hide");$("quiz").classList.remove("hide");
  $("qt").textContent=Q.length;load();
}
function pick(){
  const v=$("set").value;
  if(v==="all")return items;
  if(v==="miss")return items.filter(i=>missed.has(i.id));
  return items.filter(i=>i.set==+v);
}
function load(){
  cur=Q[idx];phase=0;errs=0;sel=-1;done=false;hintLvl=0;
  $("qn").textContent=idx+1;$("sc").textContent=score;$("stk").textContent=streak;
  $("setlab").textContent="Série #"+cur.set;
  $("pb").style.width=(idx/Q.length*100)+"%";
  $("step").textContent="Étape 1 – Clique sur le faux ami";
  $("typing").classList.add("hide");$("ans").value="";$("fb").innerHTML="";
  $("next").classList.add("hide");$("ok").classList.remove("hide");$("ok").disabled=true;
  $("hint").disabled=false;$("skip").disabled=false;
  const s=$("sentence");s.classList.remove("locked");s.innerHTML="";
  cur.toks.forEach((t,i)=>{
    const sp=document.createElement("span");sp.className="w";sp.dataset.i=i;
    sp.textContent=t.wrong?t.pre+cur.wrong+t.post:t.t;
    sp.onclick=()=>choose(i);
    s.appendChild(sp);s.appendChild(document.createTextNode(" "));
  });
}
function choose(i){
  if(phase!==0||done)return;
  document.querySelectorAll(".w").forEach(w=>w.classList.remove("sel"));
  const el=document.querySelector(`.w[data-i="${i}"]`);el.classList.add("sel");sel=i;
  $("ok").disabled=false;
  if(cur.toks[i].wrong){
    phase=1;el.classList.remove("sel");el.classList.add("sel");
    $("step").textContent="Étape 2 – Écris le mot juste";
    $("wrongw").textContent="« "+cur.wrong+" »";
    $("typing").classList.remove("hide");$("ans").focus();
    $("fb").innerHTML='<span class="ok">✔ Bien repéré !</span>';
    $("ok").disabled=false;
  }else{
    errs++;streak=0;$("stk").textContent=0;
    el.classList.add("miss");el.classList.add("shake");setTimeout(()=>el.classList.remove("shake"),300);
    $("fb").innerHTML='<span class="ko">✘ Ce mot est correct en anglais. Cherche encore.</span>';
    $("ok").disabled=true;
  }
}
function validate(){
  if(done){nextQ();return}
  if(phase!==1)return;
  const a=norm($("ans").value);if(!a)return;
  const ok=cur.answers.some(x=>norm(x)===a);
  if(ok){
    const pts=errs===0?1:0;score+=pts;streak=pts?streak+1:0;
    if(pts)missed.delete(cur.id);else missed.add(cur.id);
    finish(true,pts);
  }else{
    errs++;streak=0;$("stk").textContent=0;
    $("ans").classList.add("shake");setTimeout(()=>$("ans").classList.remove("shake"),300);
    $("fb").innerHTML='<span class="ko">✘ Pas tout à fait. Réessaie (ou clique sur 💡 Indice).</span>';
  }
}
function finish(success,pts){
  done=true;
  localStorage.setItem(KEY,JSON.stringify([...missed]));
  const wEl=document.querySelector(".w.sel,.w.good");
  document.querySelectorAll(".w").forEach(w=>w.classList.remove("sel","miss"));
  const ti=cur.toks.findIndex(t=>t.wrong);
  const el=document.querySelector(`.w[data-i="${ti}"]`);
  el.classList.add("good");
  const t=cur.toks[ti];
  const fix=document.createElement("span");fix.className="w good";fix.style.textDecoration="none";
  fix.textContent=t.pre+cur.answers[0]+t.post;
  el.after(document.createTextNode(" "),fix);
  $("sentence").classList.add("locked");
  $("typing").classList.add("hide");
  const alt=cur.answers.length>1?` <span class="mut">(aussi accepté : ${cur.answers.slice(1).join(", ")})</span>`:"";
  $("fb").innerHTML=(success?(pts?'<span class="ok">✔ Parfait ! +1</span>':'<span class="ok">✔ Correct, mais avec des erreurs (0 pt).</span>'):'<span class="ko">Réponse :</span>')+
    ` <b>${cur.wrong}</b> → <b>${cur.answers[0]}</b>${alt}`;
  $("sc").textContent=score;$("stk").textContent=streak;
  $("ok").classList.add("hide");$("next").classList.remove("hide");$("next").focus();
  $("hint").disabled=true;$("skip").disabled=true;
}
function nextQ(){
  idx++;
  if(idx>=Q.length){
    $("quiz").classList.add("hide");$("end").classList.remove("hide");
    $("endtxt").textContent=`Score : ${score} / ${Q.length} (${Math.round(score/Q.length*100)} %). Erreurs mémorisées : ${missed.size}.`;
  }else load();
}
$("start").onclick=()=>start(pick());
$("again").onclick=()=>start(pick());
$("redo").onclick=()=>{$("set").value="miss";start(pick())};
$("reset").onclick=()=>{missed.clear();localStorage.removeItem(KEY);alert("Erreurs réinitialisées.")};
$("ok").onclick=validate;
$("next").onclick=nextQ;
$("skip").onclick=()=>{if(done)return;missed.add(cur.id);streak=0;finish(false,0)};
$("hint").onclick=()=>{
  if(done)return;
  if(phase===0){
    hintLvl++;errs++;
    $("fb").innerHTML='<span class="mut">💡 Le faux ami est le mot qui commence par « '+cur.wrong[0].toUpperCase()+' ».</span>';
  }else{
    hintLvl++;errs++;
    const a=cur.answers[0];
    $("fb").innerHTML='<span class="mut">💡 '+a.slice(0,Math.min(hintLvl,a.length-1))+"_".repeat(a.length-Math.min(hintLvl,a.length-1))+" ("+a.length+" lettres)</span>";
  }
};
document.addEventListener("keydown",e=>{
  if(e.key==="Enter"&&!$("quiz").classList.contains("hide")){e.preventDefault();validate()}
});
</script>
</body>
</html>
